<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333333;
        }

        .thank-you-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            margin: 20px;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Animated Success Checkmark Ring */
        .success-checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background-color: #e6f4ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #137333;
            font-size: 40px;
            font-weight: bold;
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) delay 0.2s forwards;
            transform: scale(0);
        }

        h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 1rem;
            color: #666666;
            line-height: 1.6;
        }

        /* Smooth Entry Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            to {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <!-- Success Checkmark Icon -->
        <div class="success-checkmark">✓</div>
        
        <!-- Main Message -->
        <h1>Thank You!</h1>
        <p>Your message has been successfully received. We appreciate you taking the time to get in touch and will review your submission shortly.</p>
    </div>

</body>
</html>
